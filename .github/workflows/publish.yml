name: Publish Package

on:
    push:
        branches: [main]

permissions:
    contents: write
    packages: write

jobs:
    check-version:
        runs-on: ubuntu-latest
        outputs:
            should-publish: ${{ steps.check.outputs.should-publish }}
            version: ${{ steps.check.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"

            - name: Get package version
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Check if version exists in npm
              id: check
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Checking if version $VERSION exists in npm..."

                  # Check if the version exists in npm registry
                  if npm view mcp-validator@$VERSION version >/dev/null 2>&1; then
                    echo "Version $VERSION already exists in npm"
                    echo "should-publish=false" >> $GITHUB_OUTPUT
                  else
                    echo "Version $VERSION not found in npm, will publish"
                    echo "should-publish=true" >> $GITHUB_OUTPUT
                  fi

    publish:
        needs: check-version
        if: needs.check-version.outputs.should-publish == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Publish to npm
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ needs.check-version.outputs.version }}
                  release_name: Release v${{ needs.check-version.outputs.version }}
                  body_path: CHANGELOG.md
                  draft: false
                  prerelease: false

    test-only:
        needs: check-version
        if: needs.check-version.outputs.should-publish == 'false'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run tests
              run: yarn test

            - name: Run linter
              run: yarn lint
